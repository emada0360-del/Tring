name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android project from site/
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Talabati Training" com.talabati.training --web-dir site
          npx cap add android
          npx cap sync android
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">تدريب سائق طلباتي</string>|' android/app/src/main/res/values/strings.xml

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: TalabatiTraining-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
